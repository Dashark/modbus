# PostgreSQL / TimescaleDB 连接与查询配置
enabled: true                   # true=从数据库读；false=回退到生成器

# 连接参数（生产环境建议用环境变量覆盖，见 settings.py）
host: 127.0.0.1
port: 5432
dbname: rain_pump_station
user: postgres
password: ""                    # 建议留空，用环境变量 PUMP_DB_PASSWORD
connect_timeout: 5

# 连接池
pool_min: 1
pool_max: 4

# 查询超时（秒）
query_timeout: 3

# 泵房编号（SQL 中的 pump_room_id）
pump_room_id: "S0004-P01"

# 数据新鲜度阈值（秒）：calc_time 与当前时间差超过此值视为数据过期
stale_threshold_sec: 30

# SQL：使用参数化查询，%s 占位
query: |
  SELECT
    calc_time,
    calc_status,
    q_in_raw,
    v_in_total,
    outlet_a, outlet_b, outlet_c, outlet_d,
    (metrics->>'ID3-a-all')::float8 AS v_out_a,
    (metrics->>'ID3-b-all')::float8 AS v_out_b,
    (metrics->>'ID3-c-all')::float8 AS v_out_c,
    (metrics->>'ID3-d-all')::float8 AS v_out_d,
    v_out_total,
    q_return,
    (metrics->>'ID4-b')::float8 AS v_return_total,
    q_total_out,
    v_day, v_month, v_year,
    flag_low_flow,
    flag_high_flow
  FROM flow_calc_latest
  WHERE pump_room_id = %s;

# SQL 列 -> 点表字段映射
# 注意：v_out_total 是 4 个出水口累计之和，点表无对应字段，故意不映射
column_mapping:
  q_in_raw:        instantInFlow
  v_in_total:      totalInFlow
  outlet_a:        outInstantFlow_1
  outlet_b:        outInstantFlow_2
  outlet_c:        outInstantFlow_3
  outlet_d:        outInstantFlow_4
  v_out_a:         outTotalFlow_1
  v_out_b:         outTotalFlow_2
  v_out_c:         outTotalFlow_3
  v_out_d:         outTotalFlow_4
  q_return:        instantReturnFlow
  v_return_total:  totalReturnFlow
  q_total_out:     pumpStationInstantTotalFlow
  v_day:           pumpStationDayTotalFlow
  v_month:         pumpStationMonthTotalFlow
  v_year:          pumpStationYearTotalFlow
  flag_low_flow:   lowFlowAlarm
  flag_high_flow:  highFlowAlarm

# 仅用于日志/诊断的列（不写入寄存器）
diagnostic_columns:
  - calc_time
  - calc_status
  - v_out_total

# 未映射浮点字段的默认值：正常路径下不会触发
# 可选：0.0 / "invalid"
default_for_missing: invalid

# calc_status 判定：不等于此值视为计算异常
valid_calc_status: 1

# 布尔告警转 U16
bool_to_u16: true

# 一致性校验：|v_out_total - (v_out_a+v_out_b+v_out_c+v_out_d)| 超过阈值时告警
consistency_check:
  enabled: true
  tolerance: 0.01           # 允许的绝对误差（m³）