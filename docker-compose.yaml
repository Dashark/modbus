version: "3.9"

services:
  pump-slave:
    build: .
    image: pump-modbus:latest
    container_name: pump-slave
    restart: unless-stopped
    command: ["slave"]
    user: "0:0"
    environment:
      PUMP_DB_HOST: ${PUMP_DB_HOST:-pump-timescaledb}
      PUMP_DB_PORT: ${PUMP_DB_PORT:-5432}
      PUMP_DB_NAME: ${PUMP_DB_NAME:-rain_pump_station}
      PUMP_DB_USER: ${PUMP_DB_USER:-postgres}
      PUMP_DB_PASSWORD: ${PUMP_DB_PASSWORD:-}
      SOURCE_KIND: ${SOURCE_KIND:-db}
      MODBUS_PORT: "502"
      HEALTHCHECK_HOST: 127.0.0.1
      MODBUS_UNIT: "1"
    ports:
      - "502:502"
    volumes:
      - ./logs:/app/logs
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rain_pump_net

  pump-master:
    image: pump-modbus:latest
    container_name: pump-master
    restart: unless-stopped
    command: ["master"]
    environment:
      PLC_HOST: ${PLC_HOST:-pump-slave}
      MODBUS_PORT: "502"
    depends_on:
      pump-slave:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - rain_pump_net
    profiles:
      - master

networks:
  rain_pump_net:
    external: true
    name: rain-pump-station_pump-network