[project]
name = "pump-modbus"
version = "1.0.0"
description = "泵站流量检测系统 Modbus TCP 主从站"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    "pymodbus==3.7.*",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 开发工具：测试 + lint + 格式化
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# 安装后可直接调用：uv run pump-slave / pump-master
pump-slave  = "slave.server:main"
pump-master = "master.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "slave", "master"]

# ---------------- 工具配置 ----------------

[tool.uv]
# 允许 uv 使用系统 Python；如需强制下载可去掉
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["config", "core", "slave", "master"]
omit = ["tests/*", "*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]   # 长行交给 ruff format

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true